<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Live status of Frontline Control: game server, sign-in, saves and rooms.">
<title>Status · Frontline Control</title>
<style>
:root{--ab:#fff8eb;--abd:#f3d9a4;--bg:#f4f6fa;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--gn:#16a34a;--am:#d97706;--rd:#dc2626;--bl:#2563eb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ab:#2a2112;--abd:#5a4520;--bg:#080d18;--card:#111a2c;--tx:#e8edf6;--mu:#8b9ab5;--bd:#22304d;--gn:#4ade80;--am:#fbbf24;--rd:#f87171;--bl:#4f8cff}}
:root[data-theme="dark"]{--ab:#2a2112;--abd:#5a4520;--bg:#080d18;--card:#111a2c;--tx:#e8edf6;--mu:#8b9ab5;--bd:#22304d;--gn:#4ade80;--am:#fbbf24;--rd:#f87171;--bl:#4f8cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:24px 16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
a{color:var(--bl)}
.banner{border-radius:14px;padding:18px;font-weight:600;font-size:17px;margin-bottom:22px;background:var(--card);border:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px 16px;margin-bottom:18px}
.banner{display:flex;align-items:center;gap:14px}
.banner .ic{width:34px;height:34px}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.ic{stroke-width:2}
.ic.operational{color:var(--gn)}.ic.degraded{color:var(--am)}.ic.outage{color:var(--rd)}.ic.loading{color:var(--mu)}
.grp{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:24px 0 10px}
.grp h2{margin:0}
details{border-bottom:1px solid var(--bd)}
details:last-child{border-bottom:0}
summary{display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:2px solid var(--bl);outline-offset:2px;border-radius:6px}
.nm{flex:1;font-weight:500}
.chev{width:8px;height:8px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);margin:0 4px 3px 2px;transition:transform .15s}
details[open]>summary .chev{transform:rotate(-135deg);margin-top:5px}
.det{margin:0 0 14px 36px;color:var(--mu);font-size:14px}
.det p{margin:0 0 6px}.det b{color:var(--tx);font-weight:600}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
.mu{color:var(--mu);font-size:13px}
h2{font-size:16px;margin:24px 0 10px}
.upd{margin:6px 0 0 0;padding:0;list-style:none}
.upd li{font-size:14px;margin-top:6px}
.tag{font-size:12px;color:var(--mu);border:1px solid var(--bd);border-radius:99px;padding:1px 8px;margin-left:6px}
.inc summary{padding:12px 0}.inc .det{margin-left:0}
.act{background:var(--ab);border:1px solid var(--abd);border-radius:14px;padding:4px 16px;margin-bottom:22px}
.act details{border-bottom-color:var(--abd)}.act .nm{font-weight:600}
.past{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:0 16px;margin-bottom:18px}
.past>summary{padding:14px 0}.past>summary .nm{font-weight:600;font-size:16px}
.past .list{border-top:1px solid var(--bd)}
.past .list summary{padding:12px 0}.past .list .nm{font-weight:500}
.ic.sm{width:20px;height:20px}
.when{display:block;font-size:13px;color:var(--mu);font-weight:400}
</style>
</head>
<body>
<main>
  <header>
    <h1>Frontline Control status</h1>
    <a href="https://frontlinecontrol.co.uk">Back to the game</a>
  </header>
  <div id="overall" class="banner loading"><span id="bi"></span><span id="bt">Checking the game…</span></div>
  <div id="active"></div>
  <div id="components"></div>
  <div id="past"></div>
  <p class="mu" id="meta"></p>
</main>
<script>
(function () {
  "use strict";
  const API = window.FC_API || "https://api.frontlinecontrol.co.uk";
  const NAMES = { game: "Game server", saves: "Saves", signin: "Sign-in", rooms: "Rooms and database" };
  const WORDS = { operational: "Operational", degraded: "Degraded", outage: "Outage" };
  const SUMMARY = { operational: "All systems are working.", partial: "Some things are not working properly.", major: "The game is having a major problem." };
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const when = t => t ? new Date(t).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
  const STATUS_WORDS = { investigating: "Investigating", identified: "Identified", monitoring: "Monitoring", resolved: "Resolved" };

  const GROUPS = [["Playing", ["game", "rooms"]], ["Your account", ["signin", "saves"]]];
  const DESC = {
    game: "The live game: the map, jobs and your units.",
    rooms: "Multiplayer rooms and the database behind them.",
    signin: "Creating an account and signing in.",
    saves: "Saving and loading your progress."
  };
  const HINT = { degraded: "You may notice slowness or the odd failed action.", outage: "This part of the game is not working right now." };
  const MARK = { operational: "m9 12 2 2 4-4", degraded: "M12 8v4M12 16h.01", outage: "m15 9-6 6m0-6 6 6", loading: "M8 12h.01M12 12h.01M16 12h.01" };
  const ico = st => `<svg class="ic ${esc(st)}" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="${MARK[st] || MARK.loading}"/></svg>`;
  const OVR = { operational: "operational", partial: "degraded", major: "outage" };

  function comp(k, st, s) {
    const extra = k === "game" && s.players_in_game != null ? `<p><b>${esc(s.players_in_game)}</b> player${s.players_in_game === 1 ? "" : "s"} in game right now.</p>` : "";
    return `<details><summary>${ico(st)}<span class="nm">${esc(NAMES[k] || k)}</span><span class="mu">${esc(WORDS[st] || st)}</span><span class="chev"></span></summary>
      <div class="det"><p>${esc(DESC[k] || "Part of the Frontline Control service.")}</p>${extra}${HINT[st] ? `<p>${esc(HINT[st])}</p>` : ""}<p>Last checked ${esc(when(s.checked))}.</p></div></details>`;
  }

  const DAY = 864e5, PAST_DAYS = 30;
  const isOpen = i => i.status !== "resolved";
  const ico20 = st => ico(st).replace('class="ic ', 'class="ic sm ');
  const clock = t => new Date(t).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  const stamp = i => { const t = Date.parse(i.updated_at || i.created_at); return t || 0; };
  // when a resolved incident ended: the "resolved" update if there is one, else its last change
  const endOf = i => { const u = (i.updates || []).filter(x => x.status === "resolved" && x.at).map(x => Date.parse(x.at)).filter(Boolean).sort((a, b) => b - a)[0]; return u || stamp(i); };
  function span(i, end) {
    if (!i.created_at) return "";
    const a = new Date(i.created_at), b = new Date(end);
    if (!end || isNaN(b)) return when(i.created_at);
    return when(i.created_at) + " to " + (a.toDateString() === b.toDateString() ? clock(b) : when(b));
  }
  const updates = i => { const u = (i.updates || []).filter(x => x.body); return u.length ? `<ul class="upd">${u.map(x => `<li><span class="mu">${esc(when(x.at))}</span> · ${esc(STATUS_WORDS[x.status] || x.status)}: ${esc(x.body)}</li>`).join("")}</ul>` : ""; };

  function drawIncidents(all) {
    const active = all.filter(isOpen).sort((a, b) => stamp(b) - stamp(a));
    const cut = Date.now() - PAST_DAYS * DAY;
    const past = all.filter(i => !isOpen(i)).map(i => ({ i, end: endOf(i) })).filter(x => !x.end || x.end >= cut).sort((a, b) => b.end - a.end);
    document.getElementById("active").innerHTML = active.length ? `
      <div class="grp" style="margin-top:0"><h2>Active incidents</h2><span class="mu">${active.length} ongoing</span></div>
      <div class="act">${active.map(i => `<details class="inc" open><summary>${ico("degraded")}<span class="nm">${esc(i.title)}<span class="tag">${esc(STATUS_WORDS[i.status] || i.status)}</span></span><span class="chev"></span></summary>
        <div class="det"><p>Posted ${esc(when(i.created_at))}${i.updated_at && i.updated_at !== i.created_at ? " · updated " + esc(when(i.updated_at)) : ""}</p>${updates(i)}</div></details>`).join("")}</div>` : "";
    document.getElementById("past").innerHTML = past.length ? `
      <details class="past"><summary><span class="nm">Past incidents</span><span class="mu">${past.length} resolved</span><span class="chev"></span></summary>
        <div class="list">${past.map(x => `<details class="inc"><summary>${ico20("operational")}<span class="nm">${esc(x.i.title)}<span class="when">${esc(span(x.i, x.end))}</span></span><span class="tag">Resolved</span><span class="chev"></span></summary>
          <div class="det">${updates(x.i) || '<p>No further details.</p>'}</div></details>`).join("")}</div></details>` : "";
  }

  function draw(s) {
    const o = document.getElementById("overall");
    o.className = "banner " + (s.overall || "loading");
    document.getElementById("bi").innerHTML = ico(OVR[s.overall] || "loading");
    document.getElementById("bt").textContent = SUMMARY[s.overall] || "Status unknown.";
    const c = s.components || {}, used = new Set();
    const groups = GROUPS.map(g => [g[0], g[1].filter(k => c[k])]);
    const rest = Object.keys(c).filter(k => !GROUPS.some(g => g[1].includes(k)));
    if (rest.length) groups.push(["Other", rest]);
    document.getElementById("components").innerHTML = groups.filter(g => g[1].length).map(g => {
      const ok = g[1].filter(k => c[k] === "operational").length;
      return `<div class="grp"><h2>${esc(g[0])}</h2><span class="mu">${ok} of ${g[1].length} operational</span></div>
        <div class="card">${g[1].map(k => comp(k, c[k], s)).join("")}</div>`;
    }).join("");
    drawIncidents(s.incidents || []);
    document.getElementById("meta").textContent = "Last checked " + when(s.checked) + " · refreshes every minute.";
  }

  async function load() {
    try {
      const r = await fetch(API + "/api/status", { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      draw(await r.json());
    } catch (e) {
      const o = document.getElementById("overall");
      o.className = "banner major"; document.getElementById("bi").innerHTML = ico("outage");
      document.getElementById("bt").textContent = "Can’t reach the game server. It may be down.";
      document.getElementById("meta").textContent = "Checked " + new Date().toLocaleTimeString("en-GB") + ".";
    }
  }
  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
