  // ---------- sign-in (this site has its own storage, so it keeps its own session) ----------
  function session() { try { return JSON.parse(localStorage.getItem(SES_KEY)); } catch (e) { return null; } }
  async function token() {
    let s = session(); if (!s || !s.access_token) return null;
    if ((s.expires_at || 0) - 30 < Date.now() / 1000) {
      const r = await fetch(SB_URL + "/auth/v1/token?grant_type=refresh_token", { method: "POST", headers: { apikey: SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
      const j = await r.json().catch(() => ({})); if (!r.ok || !j.access_token) return null;
      s = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), user: j.user || s.user };
      try { localStorage.setItem(SES_KEY, JSON.stringify(s)); } catch (e) { /* ignore */ }
    }
    return s.access_token;
  }
  async function api(path, body) {
    const t = await token(); if (!t) throw new Error("Not signed in");
    const r = await fetch(API + path, { method: body ? "POST" : "GET", headers: { Authorization: "Bearer " + t, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({ ok: false, reason: "bad reply from server" }));
    if (!r.ok || j.ok === false) throw new Error(j.reason || ("HTTP " + r.status));
    return j;
  }
  function loginForm(err) {
    $("#tabs").hidden = true; $("#out").hidden = true;
    $("#main").innerHTML = `<form class="card login" id="lf" style="padding:26px 22px">
      <div class="logo">FC</div><div style="text-align:center;font-size:20px;font-weight:700;letter-spacing:-.01em">Admin sign-in</div><div class="mu" style="text-align:center;margin-bottom:18px">Admins only</div>
      <div style="margin-bottom:10px"><input id="em" type="email" placeholder="Email" autocomplete="username" required></div>
      <div style="margin-bottom:14px"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" required></div>
      <button class="btn pri" id="go" style="width:100%;padding:12px">Sign in</button>
      <div id="le" style="color:var(--rd);margin-top:12px;font-size:13px;text-align:center">${esc(err || "")}</div></form>`;
    $("#lf").onsubmit = async e => {
      e.preventDefault(); const b = $("#go"); b.disabled = true; $("#le").textContent = "";
      try {
        const r = await fetch(SB_URL + "/auth/v1/token?grant_type=password", { method: "POST", headers: { apikey: SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ email: $("#em").value.trim(), password: $("#pw").value }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.access_token) throw new Error(j.error_description || j.msg || "Sign-in failed");
        localStorage.setItem(SES_KEY, JSON.stringify({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), user: j.user }));
        start();
      } catch (x) { b.disabled = false; $("#le").textContent = x.message; }
    };
  }
  async function signOut() {
    try { const t = await token(); if (t) await fetch(SB_URL + "/auth/v1/logout", { method: "POST", headers: { apikey: SB_KEY, Authorization: "Bearer " + t } }); } catch (e) { /* ignore */ }
    try { localStorage.removeItem(SES_KEY); } catch (e) { /* ignore */ }
    closeSheet(); closeModal(); loginForm();

  // ---------- players list ----------
  async function loadPlayers() {
    const box = $("#list"); if (!box) return;
    try {
      const j = await api("/api/admin/users?q=" + encodeURIComponent(q) + "&page=" + page);
      const pages = Math.max(1, Math.ceil(j.total / j.per));
      box.innerHTML = (j.users.length ? j.users.map(u => `
        <div class="card pl" data-id="${esc(u.id)}">${avatar(u)}
          <div class="m"><b>${esc(u.name || u.email || u.id)}${badges(u)}${u.online ? '<span class="tag t-on">ONLINE</span>' : ""}${u.banned_until ? '<span class="tag t-ban">SUSPENDED</span>' : ""}</b>

        `<div class="pg"><button class="btn" id="prev" ${page <= 1 ? "disabled" : ""}>← Back</button><span class="mu">${j.total} player${j.total === 1 ? "" : "s"} · page ${page} of ${pages}</span><button class="btn" id="next" ${page >= pages ? "disabled" : ""}>Next →</button></div>`;

  async function openRoom(id) {
    curRoom = id;
    $("#main").innerHTML = '<div class="card mu">Loading…</div>';
    try {
      const j = await api("/api/admin/room?id=" + encodeURIComponent(id));
      const r = j.room, mem = j.members, open = j.missions, hist = j.recent;
      const pname = x => x.name || x.display_name || "Player";
      $("#main").innerHTML = `<button class="btn sm" id="rback">← All rooms</button>
        <h3>${esc(r.name || "Room")} <span class="mu">code ${esc(r.code)}</span></h3>
        <div class="card mu">Host: ${esc(r.host_name || "unknown")} · ${mem.length} ${mem.length === 1 ? "member" : "members"} · ${open.length} open call${open.length === 1 ? "" : "s"}</div>
        <h3>Members</h3><div class="card">${mem.length ? mem.map(x => `<div class="item">${avatar({ id: x.user_id, name: pname(x) })}
            <div class="m"><b>${esc(pname(x))}${x.user_id === r.host_id ? ' <span class="tag t-ad">HOST</span>' : ""}</b><span class="mu">seen ${esc(relTime(x.last_seen))}</span></div>
            <div class="acts admin-only"><button class="btn sm ghr" data-rm="${esc(x.user_id)}">Remove</button></div></div>`).join("") : '<div class="empty">No members</div>'}</div>
        <h3>Open calls</h3><div class="card">${open.length ? open.map(x => `<div class="item"><div class="m"><b>${esc(x.loc || "Call")}</b><span class="mu">${esc(x.owner_name || "Ally")} · ${esc(x.status)}</span></div>
            <div class="acts admin-only"><button class="btn sm ghr" data-mc="${esc(x.id)}">Cancel</button></div></div>`).join("") : '<div class="empty">No open calls</div>'}</div>
        <h3>Recently finished</h3><div class="card">${hist.length ? hist.map(x => `<div class="lg"><b>${esc(x.loc || "Call")}</b> <span class="mu">${esc(x.status)} · ${esc(x.owner_name || "")} · ${esc(when(x.updated_at))}</span></div>`).join("") : '<div class="empty">None</div>'}</div>
        <h3>Danger zone</h3><div class="card"><button class="btn red" id="rclose" style="width:100%">Close this room</button>
          <div class="mu" style="margin-top:8px">Removes everyone, cancels open calls and hides the room from players. Rewards already earned are kept.</div></div>`;
      $("#rback").onclick = showRooms;
      $("#rclose").onclick = () => ask("Close " + (r.name || "this room") + "?", "Everyone is removed and open calls are cancelled. Rewards already earned are kept.", { ok: "Close room", danger: 1, reason: 1 })
        .then(x => { if (x) roomAct({ type: "room_close", roomId: id, reason: x.reason }); });
      $("#main").querySelectorAll("[data-rm]").forEach(b => b.onclick = () => {
        const x = mem.find(v => v.user_id === b.dataset.rm);
        ask("Remove " + pname(x) + "?", "They leave this room and their open calls here are cancelled.", { ok: "Remove", danger: 1, reason: 1 })
          .then(y => { if (y) roomAct({ type: "room_member_remove", roomId: id, uid: x.user_id, reason: y.reason }); });
      });
      $("#main").querySelectorAll("[data-mc]").forEach(b => b.onclick = () => {
        ask("Cancel this call?", "The call stops for everyone in the room.", { ok: "Cancel call", danger: 1, reason: 1 })
          .then(y => { if (y) roomAct({ type: "room_mission_cancel", roomId: id, missionId: b.dataset.mc, reason: y.reason }); });
      });
    } catch (e) { toast(e.message); showRooms(); }
  }
  async function roomAct(body) {
    try {
      const r = await api("/api/admin/room/action", body);
      toast(r.msg || "Done");
      if (body.type === "room_close") showRooms(); else openRoom(body.roomId);
    } catch (e) { toast(e.message); }
  }

  // ---------- admin action log (cards with names) ----------
  const ACTION_NAMES = { credits: "Credits", ban: "Suspended", unban: "Unsuspended", reset: "Game reset", deletegame: "Game deleted",
    delvehicle: "Vehicle removed", delstation: "Station removed", delhospital: "Hospital removed", movevehicle: "Vehicle moved",
    setroles: "Roles", deleteuser: "User deleted", removeavatar: "Picture removed", announce: "Announcement", announce_end: "Announcement ended", incident: "Incident", incident_update: "Incident update",
    setrank: "Rank changed", bonus: "Bonus created", bonus_end: "Bonus ended", room_close: "Room closed", room_member_remove: "Removed from room", room_mission_cancel: "Call cancelled" };
  const CAT = { credits: "money", unban: "info", ban: "danger", setroles: "info", reset: "warn", deletegame: "danger", deleteuser: "danger", removeavatar: "warn", delvehicle: "danger",
    delstation: "danger", delhospital: "danger", movevehicle: "info", announce: "info", announce_end: "info", incident: "warn", incident_update: "warn",
    setrank: "info", bonus: "money", bonus_end: "info", room_close: "danger", room_member_remove: "danger", room_mission_cancel: "warn" };
  const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
  function relTime(t) {
    const s = (Date.now() - Date.parse(t)) / 1000;
    if (!(s >= 0)) return when(t);
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h ago";
    return when(t);
  }
  function sentence(l) {
    const d = l.detail || {};
    const A = l.adminName ? "<b>" + esc(l.adminName) + "</b>" : "An admin";
    const P = l.targetName ? "<b>" + esc(l.targetName) + "</b>" : "a player";
    const refund = d.refund ? "Refund given" : "No refund";
    switch (l.action) {
      case "credits": return { say: A + (d.amount > 0 ? " gave " : " took ") + "<b>" + money(Math.abs(d.amount)) + "</b>" + (d.amount > 0 ? " to " : " from ") + P, meta: "Balance " + money(d.before) + " → " + money(d.after) };
      case "ban": return { say: A + " suspended " + P, meta: d.hours === "permanent" ? "Permanent" : "For " + plural(d.hours, "hour") };
      case "unban": return { say: A + " lifted " + P + "'s suspension" };
      case "setroles": return { say: A + " changed " + P + "'s roles", meta: ((d.from || []).join(", ") || "no roles") + " → " + ((d.to || []).join(", ") || "no roles") };
      case "setrank": return { say: A + " set " + P + "'s rank to <b>" + esc(rankName(d.to)) + "</b>", meta: rankName(d.from) + " → " + rankName(d.to) };
      case "bonus": return { say: A + " created the bonus <b>" + esc(d.title) + "</b> (" + money(d.amount) + " each)", meta: "Open for " + plural(d.hours, "hour") };
      case "bonus_end": return { say: A + " ended the bonus <b>" + esc(d.title || "") + "</b>" };
      case "reset": return { say: A + " reset " + P + "'s game" };
      case "removeavatar": return { say: A + " removed " + P + "'s profile picture" };
      case "deleteuser": return { say: A + " deleted the account of " + P };
      case "deletegame": return { say: A + " deleted " + P + "'s saved game" };
      case "delvehicle": return { say: A + " removed a vehicle from " + P + "'s game", meta: refund };
      case "delstation": return { say: A + " removed a station from " + P + "'s game", meta: refund };
      case "delhospital": return { say: A + " removed a hospital or prison from " + P + "'s game", meta: refund };
      case "movevehicle": return { say: A + " moved a vehicle in " + P + "'s game" };
      case "announce": return { say: A + " published <b>" + esc(d.title) + "</b>", meta: "Shown " + (d.hours === "until ended" ? "until ended" : "for " + plural(d.hours, "hour")) };
      case "announce_end": return { say: A + " ended an announcement" };
      case "incident": return { say: A + " posted <b>" + esc(d.title) + "</b>", meta: "Status: " + esc(d.status) };
      case "incident_update": return { say: A + " set an incident to " + esc(d.status) };
      case "room_close": return { say: A + " closed the room <b>" + esc(d.room || "") + "</b>", meta: d.code ? "Code " + esc(d.code) : "" };
      case "room_member_remove": return { say: A + " removed " + P + " from a room" };
      case "room_mission_cancel": return { say: A + " cancelled a call in a room", meta: d.call ? "Call: " + esc(d.call) : "" };
      default: return { say: A + " did " + esc(l.action) };
    }
  }
  function logLine(l) {
    const s = sentence(l), cat = CAT[l.action] || "info", d = l.detail || {};
    return `<div class="evt">${avatar({ id: l.admin, name: l.adminName || "?" })}<div class="txt">
      <div class="head"><span class="pill ${cat}">${esc(ACTION_NAMES[l.action] || l.action)}</span><span class="when" title="${esc(when(l.t))}">${esc(relTime(l.t))}</span></div>
      <div class="say">${s.say}</div>${s.meta ? `<div class="meta">${s.meta}</div>` : ""}${d.reason ? `<div class="meta">Reason: ${esc(d.reason)}</div>` : ""}
    </div></div>`;
  }

  // ---------- roles (owner sets them; everyone else sees them) ----------
  function rolesCard(u) {
    const has = r => (u.roles || []).includes(r);
    const card = (cls, ico, name, desc, inner) => `<label class="role ${cls}">${inner}<span class="sym">${ico}</span><b>${name}</b><span class="d">${desc}</span><span class="tick">${IC.check}</span></label>`;
    if (u.owner) return `<h3>Roles</h3><div class="roles"><div class="role fixed"><span class="sym">${IC.sshield}</span><b>Super Admin</b><span class="d">Full control, including roles. Set in ADMIN_IDS on the server, so it can't be changed here.</span></div></div>`;
    if (!me.owner) {
      const list = [];
      if (has("admin")) list.push('<div class="role admin" style="border-color:var(--c);cursor:default"><span class="sym">' + IC.shield + '</span><b>Admin</b><span class="d">Can do everything in this panel.</span></div>');
      if (has("developer")) list.push('<div class="role dev" style="border-color:var(--c);cursor:default"><span class="sym">' + IC.code + '</span><b>Developer</b><span class="d">Views games, gives credits, spawns test calls.</span></div>');
      return `<h3>Roles</h3>` + (list.length ? `<div class="roles">${list.join("")}</div>` : '<div class="card mu">No staff role</div>');
    }
    return `<h3>Roles</h3><div class="roles">
      ${card("admin", IC.shield, "Admin", "Can do everything in this panel.", `<input type="checkbox" id="rl_a" ${has("admin") ? "checked" : ""}>`)}
      ${card("dev", IC.code, "Developer", "View games, give credits, spawn test calls, reset or delete saved games.", `<input type="checkbox" id="rl_d" ${has("developer") ? "checked" : ""}>`)}
    </div><button class="btn pri" id="rl_s" style="width:100%;margin-top:12px">Save roles</button>`;
  }

  function show() { if (tab === "p") showPlayers(); else if (tab === "r") showRooms(); else if (tab === "n") showAnnounce(); else if (tab === "b") showBonuses(); else if (tab === "i") showIncidents(); else showLog(); }
  document.querySelectorAll("#tabs button").forEach(b => { b.onclick = () => { tab = b.dataset.t; document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b)); show(); }; });

  async function start() {
    if (!session()) return loginForm();
    try { me = await api("/api/admin/me"); }
    catch (e) {
      if (/not an admin/i.test(e.message)) { try { localStorage.removeItem(SES_KEY); } catch (x) { /* ignore */ } return loginForm("That account isn't an admin."); }
      if (/not signed in|401|invalid|expired|jwt/i.test(e.message)) { try { localStorage.removeItem(SES_KEY); } catch (x) { /* ignore */ } return loginForm("Session expired, please sign in again."); }
      $("#main").innerHTML = '<div class="card" style="color:var(--rd)">Can\'t open the admin panel: ' + esc(e.message) + '<div class="row" style="margin-top:10px"><button class="btn" id="rt">Retry</button><button class="btn" id="so">Sign out</button></div></div>';
      $("#rt").onclick = start; $("#so").onclick = signOut; return;
    }
    const staff = me.perms || [];
    document.body.classList.toggle("dev-view", !staff.includes("admin"));
    document.querySelectorAll("#tabs button").forEach(b => { if (["r", "n", "b", "i", "l"].includes(b.dataset.t)) b.hidden = !staff.includes("admin"); });
    $("#tabs").hidden = false; $("#out").hidden = false; show();
  }
  start();
})();
</script>
</body>
</html>
