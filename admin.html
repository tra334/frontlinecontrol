<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Admin · Frontline Control</title>
<style>
:root{
  --bg:#eef1f6;--card:#fff;--card2:#f6f8fb;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;
  --ac:#2563eb;--ac2:#1d4ed8;--acs:rgba(37,99,235,.1);
  --rd:#dc2626;--rds:rgba(220,38,38,.1);--gn:#16a34a;--gns:rgba(22,163,74,.12);--am:#d97706;--ams:rgba(217,119,6,.13);
  --sh:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);--r:14px
}
@media(prefers-color-scheme:dark){:root{
  --bg:#080d18;--card:#111a2c;--card2:#16203a;--tx:#e8edf6;--mu:#8b9ab5;--bd:#22304d;
  --ac:#4f8cff;--ac2:#3b7bf5;--acs:rgba(79,140,255,.14);
  --rd:#f87171;--rds:rgba(248,113,113,.14);--gn:#4ade80;--gns:rgba(74,222,128,.14);--am:#fbbf24;--ams:rgba(251,191,36,.14);
  --sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:40px;height:40px;object-fit:contain;flex:none;display:block}
.brand b{font-size:16px;letter-spacing:-.01em;display:block;line-height:1.1}.brand span{font-size:12px;color:var(--mu)}
main{max-width:820px;margin:0 auto;padding:16px}
.seg{display:flex;gap:4px;background:var(--card2);border:1px solid var(--bd);padding:3px;border-radius:11px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;font-weight:600;font-size:14px;color:var(--mu);cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;cursor:pointer;background:var(--card2);color:var(--tx);border:1px solid var(--bd);transition:filter .15s,transform .05s}
.btn:active{transform:scale(.98)}.btn:hover{filter:brightness(.97)}.btn:disabled{opacity:.45;pointer-events:none}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.red{background:var(--rd);border-color:var(--rd);color:#fff}.btn.grn{background:var(--gn);border-color:var(--gn);color:#04210f}.btn.amb{background:var(--am);border-color:var(--am);color:#1f1300}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.ghr{background:var(--rds);border-color:transparent;color:var(--rd)}.btn.gha{background:var(--acs);border-color:transparent;color:var(--ac)}
input,select{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;outline:none}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;margin:0 0 10px;box-shadow:var(--sh)}
.mu{color:var(--mu);font-size:13px}
.row{display:flex;gap:8px}.row>*{flex:1}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.04em;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.t-on{background:var(--gns);color:var(--gn)}.t-ban{background:var(--rds);color:var(--rd)}.t-ad{background:var(--acs);color:var(--ac)}
.t-idle{background:var(--gns);color:var(--gn)}.t-busy{background:var(--ams);color:var(--am)}
.pl{display:flex;gap:12px;align-items:center;cursor:pointer;transition:transform .08s,border-color .15s}
.pl:hover{border-color:var(--ac)}.pl:active{transform:scale(.995)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:15px;position:relative;overflow:hidden}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pl .m{flex:1;min-width:0}.pl b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .m .mu{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .r{text-align:right;flex:none}.pl .r b{font-variant-numeric:tabular-nums}
.pg{display:flex;justify-content:space-between;align-items:center;margin:8px 0 24px;gap:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.stat{background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.stat span{display:block;font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.stat b{display:block;font-size:19px;letter-spacing:-.01em;margin-top:2px;font-variant-numeric:tabular-nums}
h3{margin:20px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.item .m{flex:1;min-width:0}.item .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m .mu{display:block}
.ico{width:36px;height:36px;border-radius:10px;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-size:17px;flex:none}
.acts{display:flex;gap:6px;flex:none}
.empty{text-align:center;color:var(--mu);padding:22px 0}
.lg{font-size:13.5px;padding:9px 0;border-bottom:1px solid var(--bd)}.lg:last-child{border:0}
.lg .mu{font-size:12px}
#sheet{position:fixed;inset:0;background:var(--bg);display:none;z-index:20;overflow:auto;-webkit-overflow-scrolling:touch}
.sh-top{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.sh-in{max-width:820px;margin:0 auto}
.sh-body{max-width:820px;margin:0 auto;padding:14px 16px 40px}
#modal{position:fixed;inset:0;background:rgba(2,6,16,.6);display:none;z-index:40;align-items:flex-end;justify-content:center;padding:12px}
#modal.on{display:flex}
#modal .box{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:up .18s ease-out}
@media(min-width:600px){#modal{align-items:center}}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.pick{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--card2);border:1px solid var(--bd);border-radius:11px;padding:11px 13px;margin-top:7px;cursor:pointer}
.pick:hover{border-color:var(--ac)}
.chk{display:flex;gap:9px;align-items:center;margin-top:12px;font-size:14px;cursor:pointer}.chk input{width:18px;height:18px;flex:none;margin:0}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172a;color:#fff;border-radius:12px;padding:11px 18px;z-index:60;max-width:90%;display:none;box-shadow:0 8px 30px rgba(0,0,0,.35);font-size:14px}
.login{width:100%;max-width:380px;margin:0 auto}
.login .logo{width:120px;height:120px;margin:0 auto 10px;display:block}
[hidden]{display:none!important}
body.logged-out header{display:none}
body.logged-out main{max-width:none;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
body.dev-view .admin-only{display:none!important}
.tag.t-dev{background:var(--acs);color:var(--ac)}
@media (max-width:640px){
  header{flex-wrap:wrap;padding:10px 12px;gap:10px}
  .brand{flex:1 1 auto;min-width:0}
  .brand span{display:none}
  #tabs{order:3;flex:1 1 100%;display:flex;width:100%}
  #tabs[hidden]{display:none}
  #tabs button{flex:1;padding:8px 2px;font-size:12.5px;white-space:nowrap}
  #out{order:2;flex:none}
}
.evt{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--bd);align-items:flex-start}
.evt:last-child{border-bottom:0}
.evt .txt{flex:1;min-width:0}
.evt .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.evt .when{color:var(--mu);font-size:12px;margin-left:auto;white-space:nowrap}
.evt .say{font-size:15px;margin-top:4px;overflow-wrap:anywhere}
.evt .meta{color:var(--mu);font-size:13px;margin-top:3px;overflow-wrap:anywhere}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.money{background:var(--gns);color:var(--gn)}
.pill.danger{background:var(--rds);color:var(--rd)}
.pill.warn{background:var(--ams);color:var(--am)}
.pill.info{background:var(--acs);color:var(--ac)}

/* ===== refreshed look ===== */
:root{--r:16px;--ow:#8b5cf6;--ows:rgba(139,92,246,.14);--dv:#06b6d4;--dvs:rgba(6,182,212,.14)}
body{background:radial-gradient(1100px 420px at 50% -120px,var(--acs),transparent 70%),var(--bg);background-attachment:fixed}
header{padding:12px 18px}
main{padding:20px 16px 40px}
.seg{border-radius:12px;padding:4px}
.seg button{transition:background .15s,color .15s}
.btn{border-radius:11px;padding:11px 17px;font-weight:650}
.btn.pri{box-shadow:0 2px 8px rgba(37,99,235,.28)}
input,select,textarea{border-radius:11px}
textarea{padding:11px 13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;outline:none;border-radius:11px}
textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.card{border-radius:var(--r);padding:16px 18px;margin:0 0 12px}
.pl{padding:14px 16px}
.pl:hover{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs),var(--sh)}
.av{width:46px;height:46px;font-size:16px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
h3{display:flex;align-items:center;gap:8px;margin:26px 0 10px;font-size:13px;letter-spacing:.06em}
h3::after{content:"";flex:1;height:1px;background:var(--bd)}
.stats{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{border-radius:13px;padding:12px 14px;background:var(--card)}
.stat b{font-size:20px}
.stat.hero{background:linear-gradient(135deg,var(--acs),transparent);border-color:var(--ac)}
.sh-top{padding-bottom:12px}
.tag{display:inline-flex;align-items:center;gap:3px}

/* role badges (list + header) */
.rb{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;letter-spacing:.04em;border-radius:999px;padding:2px 8px 2px 6px;margin-left:6px;vertical-align:2px}
.rb svg{width:12px;height:12px;flex:none}
.rb.owner{background:var(--ows);color:var(--ow)}
.rb.admin{background:var(--acs);color:var(--ac)}
.rb.dev{background:var(--dvs);color:var(--dv)}

/* role picker */
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.role{position:relative;display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:16px;border:2px solid var(--bd);background:var(--card);cursor:pointer;transition:border-color .15s,background .15s,transform .08s;user-select:none}
.role:active{transform:scale(.99)}
.role input{position:absolute;opacity:0;pointer-events:none}
.role .sym{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--tint);color:var(--c)}
.role .sym svg{width:26px;height:26px}
.role b{font-size:16px;letter-spacing:-.01em}
.role .d{font-size:13px;color:var(--mu);line-height:1.4}
.role .tick{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;color:transparent;transition:all .15s}
.role .tick svg{width:14px;height:14px}
.role.admin{--c:var(--ac);--tint:var(--acs)}
.role.dev{--c:var(--dv);--tint:var(--dvs)}
.role:has(input:checked){border-color:var(--c);background:linear-gradient(160deg,var(--tint),transparent 75%),var(--card)}
.role:has(input:checked) .tick{background:var(--c);border-color:var(--c);color:#fff}
.role:has(input:focus-visible){outline:3px solid var(--tint);outline-offset:2px}
.role.fixed{cursor:default;--c:var(--ow);--tint:var(--ows);border-color:var(--c);background:linear-gradient(160deg,var(--tint),transparent 75%),var(--card)}

/* credits */
.bal{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.bal span{color:var(--mu);font-size:13px}.bal b{font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.mode button{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;border:2px solid var(--bd);background:var(--card);font-weight:700;cursor:pointer;transition:all .15s}
.mode button svg{width:18px;height:18px}
.mode button.give.on{border-color:var(--gn);background:var(--gns);color:var(--gn)}
.mode button.take.on{border-color:var(--am);background:var(--ams);color:var(--am)}
.lbl{display:block;font-size:12.5px;font-weight:650;color:var(--mu);margin:0 0 6px}
.amtw{position:relative}
.amtw i{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-style:normal;font-weight:700;color:var(--mu);font-size:18px}
.amtw input{padding-left:32px;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.quick button{border:1px solid var(--bd);background:var(--card2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:650;cursor:pointer}
.quick button:hover{border-color:var(--ac);color:var(--ac)}
.prev{font-size:14px;padding:11px 13px;border-radius:11px;background:var(--card2);border:1px dashed var(--bd);margin:14px 0;color:var(--mu)}
.prev b{color:var(--tx)}
.go.give{background:var(--gn);border-color:var(--gn);color:#04210f}
.go.take{background:var(--am);border-color:var(--am);color:#1f1300}

/* danger zone */
.dz{border-color:color-mix(in srgb,var(--rd) 40%,var(--bd));background:linear-gradient(160deg,var(--rds),transparent 60%),var(--card)}
.dz .dzr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.dz .dzr:last-child{border:0;padding-bottom:0}.dz .dzr:first-child{padding-top:0}
.dz .dzr b{display:block}.dz .dzr .mu{display:block;margin-top:2px}
@media(max-width:520px){.dz .dzr{flex-direction:column;align-items:stretch}}
.dz .dzr.off{opacity:.5}.dz .dzr.off .btn{background:var(--card2);border-color:var(--bd);color:var(--mu);cursor:not-allowed}
.dz .dzr.final{margin-top:14px;padding:14px;border:1px solid color-mix(in srgb,var(--rd) 45%,var(--bd));border-radius:14px;background:color-mix(in srgb,var(--rd) 9%,var(--card))}
.dz .dzr.final:last-child{padding-bottom:14px}
.dz .dzr.final .ic{width:40px;height:40px;border-radius:12px;background:var(--rds);color:var(--rd);display:grid;place-items:center;flex:none}
.dz .dzr.final .ic svg{width:20px;height:20px}
.dz .dzr.final .tx{flex:1;min-width:0}
.dz .dzr.final .tx b{color:var(--rd);letter-spacing:-.01em}
.dz .dzr.final .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;box-shadow:0 2px 10px color-mix(in srgb,var(--rd) 35%,transparent)}
.dz .dzr.final .btn svg{width:16px;height:16px;flex:none}
@media(max-width:520px){.dz .dzr.final{flex-wrap:wrap}.dz .dzr.final .tx{flex:1 1 calc(100% - 56px)}.dz .dzr.final .btn{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

      <div style="margin-bottom:10px"><input id="em" type="email" placeholder="Email" autocomplete="username" required></div>
      <div style="margin-bottom:14px"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" required></div>
      <button class="btn pri" id="go" style="width:100%;padding:12px">Sign in</button>

    $("#lf").onsubmit = async e => {
      e.preventDefault(); const b = $("#go"); b.disabled = true; $("#le").textContent = "";
      try {
        const r = await fetch(SB_URL + "/auth/v1/token?grant_type=password", { method: "POST", headers: { apikey: SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ email: $("#em").value.trim(), password: $("#pw").value }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.access_token) throw new Error(j.error_description || j.msg || "Sign-in failed");
        localStorage.setItem(SES_KEY, JSON.stringify({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), user: j.user }));
        start();
      } catch (x) { b.disabled = false; $("#le").textContent = x.message; }
    };
  }
  async function signOut() {
    try { const t = await token(); if (t) await fetch(SB_URL + "/auth/v1/logout", { method: "POST", headers: { apikey: SB_KEY, Authorization: "Bearer " + t } }); } catch (e) { /* ignore */ }
    try { localStorage.removeItem(SES_KEY); } catch (e) { /* ignore */ }
    closeSheet(); closeModal(); loginForm();
  }
  $("#out").onclick = signOut;

  // ---------- players list ----------
  async function loadPlayers() {
    const box = $("#list"); if (!box) return;
    try {
      const j = await api("/api/admin/users?q=" + encodeURIComponent(q) + "&page=" + page);
      const pages = Math.max(1, Math.ceil(j.total / j.per));
      box.innerHTML = (j.users.length ? j.users.map(u => `
        <div class="card pl" data-id="${esc(u.id)}">${avatar(u)}
          <div class="m"><b>${esc(u.name || u.email || u.id)}${badges(u)}${u.online ? '<span class="tag t-on">ONLINE</span>' : ""}${u.banned_until ? '<span class="tag t-ban">SUSPENDED</span>' : ""}</b>
          <span class="mu">${esc(u.email)}${u.last ? " · seen " + esc(when(u.last)) : ""}</span></div>
          <div class="r"><b>${u.hasGame ? money(u.cr) : "–"}</b><span class="mu">${u.hasGame ? (u.done || 0) + " jobs" : "no game"}</span></div>
        </div>`).join("") : '<div class="card empty">No players found.</div>') +
        `<div class="pg"><button class="btn" id="prev" ${page <= 1 ? "disabled" : ""}>← Back</button><span class="mu">${j.total} player${j.total === 1 ? "" : "s"} · page ${page} of ${pages}</span><button class="btn" id="next" ${page >= pages ? "disabled" : ""}>Next →</button></div>`;
      box.querySelectorAll(".pl").forEach(e => { e.onclick = () => openUser(e.dataset.id); });
      const pv = $("#prev"), nx = $("#next");
      if (pv) pv.onclick = () => { page--; loadPlayers(); };
      if (nx) nx.onclick = () => { page++; loadPlayers(); };
    } catch (e) { box.innerHTML = '<div class="card" style="color:var(--rd)">' + esc(e.message) + "</div>"; }
  }
  function showPlayers() {
    $("#main").innerHTML = '<input id="q" type="search" placeholder="Search name, email or ID" autocomplete="off" style="margin-bottom:12px"><div id="list"><div class="card mu">Loading…</div></div>';
    $("#q").value = q;
    $("#q").oninput = e => { clearTimeout(timer); timer = setTimeout(() => { q = e.target.value; page = 1; loadPlayers(); }, 350); };
    loadPlayers();
  }

  // ---------- one player ----------
  const sheet = $("#sheet");
  function closeSheet() { sheet.style.display = "none"; sheet.innerHTML = ""; cur = null; document.body.style.overflow = ""; }

  async function openUser(id, view) {
    document.body.style.overflow = "hidden";
    const keep = sheet.scrollTop;
    if (!cur || cur.id !== id) sheet.innerHTML = '<div class="sh-body"><div class="card mu">Loading…</div></div>';
    sheet.style.display = "block";
    try {
      const j = await api("/api/admin/user?id=" + encodeURIComponent(id));
      cur = { id, data: j, view: view || (cur && cur.id === id ? cur.view : "o"), filter: (cur && cur.id === id && cur.filter) || "" };
      drawUser(); sheet.scrollTop = keep;
    } catch (e) { sheet.innerHTML = '<div class="sh-body"><div class="card" style="color:var(--rd)">' + esc(e.message) + '</div><button class="btn" id="x2" style="width:100%">Close</button></div>'; $("#x2").onclick = closeSheet; }
  }

  // one admin action; refreshes the player afterwards
  async function run(body, label) {
    try { const r = await api("/api/admin/action", Object.assign({ uid: cur.id }, body)); toast(r.msg || label || "Done"); await openUser(cur.id); loadPlayers(); }
    catch (e) { toast(e.message); }
  }

  function drawUser() {
    const { data: j, view } = cur, u = j.user, g = j.game, label = u.name || u.email || u.id;
    const V = [["o", "Overview"], ["s", "Stations"], ["v", "Vehicles"], ["g", "Logs"]];
    sheet.innerHTML = `<div class="sh-top"><div class="sh-in">
        <div style="display:flex;gap:12px;align-items:center">${avatar(u)}
          <div style="flex:1;min-width:0"><b style="font-size:17px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(label)}${badges(u)}${u.banned_until ? '<span class="tag t-ban">SUSPENDED</span>' : ""}</b><span class="mu" style="display:block;overflow:hidden;text-overflow:ellipsis">${esc(u.email)}</span></div>
          <button class="btn sm" id="x">Close</button></div>
        <div class="seg" style="margin-top:10px">${V.map(v => `<button data-v="${v[0]}" class="${v[0] === view ? "on" : ""}" style="flex:1;padding:7px 4px">${v[1]}</button>`).join("")}</div>
      </div></div><div class="sh-body" id="sb"></div>`;
    $("#x").onclick = closeSheet;
    sheet.querySelectorAll(".seg button").forEach(b => { b.onclick = () => { cur.view = b.dataset.v; drawUser(); sheet.scrollTop = 0; }; });
    const sb = $("#sb");
    if (view === "o") overview(sb, u, g, label);
    else if (!g) sb.innerHTML = '<div class="card empty">This player has no saved game.</div>';
    else if (view === "s") stations(sb, g);
    else if (view === "v") vehicles(sb, g);
    else logs(sb, g);
  }

  // ---------- rank (admin sets it by hand; the game otherwise works it out from jobs done) ----------
  const RANKS = ["Trainee Call-Handler", "Dispatcher", "Senior Dispatcher", "Duty Officer", "Inspector", "Chief Controller"];
  const rankName = i => i == null ? "Automatic" : (RANKS[i] || ("Rank " + i));
  function rankCard(g) {
    if (!g) return "";
    const idx = typeof g.rankIdx === "number" ? g.rankIdx : RANKS.indexOf(g.rank), manual = g.rankOverride != null;
    return `<h3 class="admin-only">Rank</h3><div class="card admin-only">
      <div class="bal"><span>Current rank${manual ? " (set by hand)" : ""}</span><b style="font-size:18px">${esc(g.rank || "–")}</b></div>
      <label class="lbl" for="rk_sel">Set rank</label>
      <select id="rk_sel">${RANKS.map((n, i) => `<option value="${i}" ${i === idx ? "selected" : ""}>${esc(n)}</option>`).join("")}<option value="auto">Automatic (from jobs done)</option></select>
      <input id="rk_why" placeholder="Reason (kept in the log)" style="margin-top:8px">
      <button class="btn pri" id="rk_go" style="width:100%;margin-top:10px">Set rank</button>
      <div class="mu" style="margin-top:8px">A rank set by hand stays fixed until you set it back to Automatic. Vehicle and building unlocks follow the rank.</div></div>`;
  }

  function overview(sb, u, g, label) {
    sb.innerHTML = `
      ${g ? `<div class="stats"><div class="stat"><span>Rank</span><b style="font-size:15px">${esc(g.rank || "–")}</b></div><div class="stat hero"><span>Credits</span><b>${money(g.cr)}</b></div><div class="stat"><span>Jobs done</span><b>${g.done}</b></div>
        <div class="stat"><span>Stations</span><b>${g.stations}</b></div><div class="stat"><span>Hospitals / prisons</span><b>${g.hospitals}</b></div><div class="stat"><span>Vehicles</span><b>${g.vehicles}</b></div><div class="stat"><span>Staff</span><b>${g.staff}</b></div><div class="stat"><span>On game server</span><b>${g.running ? "Yes" : "No"}</b></div></div>` : '<div class="card mu">No saved game.</div>'}
      <div class="card"><div class="stats" style="margin-top:0"><div class="stat"><span>Joined</span><b style="font-size:14px">${esc(when(u.created))}</b></div><div class="stat"><span>Last sign-in</span><b style="font-size:14px">${esc(when(u.last))}</b></div>${u.banned_until ? `<div class="stat"><span>Suspended until</span><b style="font-size:14px">${esc(when(u.banned_until))}</b></div>` : ""}</div>
        <div class="mu" style="word-break:break-all">ID ${esc(u.id)}</div></div>
      ${rolesCard(u)}
      ${rankCard(g)}
      <h3>Credits</h3><div class="card">
        <div class="bal"><span>Current balance</span><b>${g ? money(g.cr) : "–"}</b></div>
        <div class="mode"><button class="give on" id="m_give" type="button">${IC.plus} Give credits</button><button class="take" id="m_take" type="button">${IC.minus} Take credits</button></div>
        <label class="lbl" for="amt">Amount</label>
        <div class="amtw"><i>£</i><input id="amt" type="number" inputmode="numeric" min="1" placeholder="e.g. 50000"></div>
        <div class="quick">${[1000, 5000, 10000, 50000, 100000].map(n => `<button type="button" data-q="${n}">${money(n)}</button>`).join("")}</div>
        <label class="lbl" for="why">Reason (kept in the log)</label>
        <input id="why" placeholder="Optional, e.g. compensation for a bug">
        <div class="prev" id="prev_cr">Enter an amount to see the new balance.</div>
        <button class="btn go give" id="cr_go" style="width:100%;padding:13px">Give credits</button></div>
      <h3 class="admin-only">Suspend</h3><div class="card admin-only">
        ${u.admin ? '<div class="mu">Admins can\'t be suspended or reset from here.</div>' : u.banned_until ? '<button class="btn pri" id="unban" style="width:100%">Lift suspension</button>' : `
        <div class="row"><select id="dur"><option value="1">1 hour</option><option value="24" selected>1 day</option><option value="168">7 days</option><option value="720">30 days</option><option value="0">Permanent</option></select><input id="bwhy" placeholder="Reason (kept in the log)"></div>
        <button class="btn red" id="ban" style="width:100%;margin-top:8px">Suspend</button>`}</div>
      ${u.admin ? "" : `<h3>Danger zone</h3><div class="card dz">
        <div class="dzr"><div><b>Reset game</b><span class="mu">Starts them on a brand new game.</span></div><button class="btn amb" id="reset">Reset game</button></div>
        <div class="dzr"><div><b>Delete saved game</b><span class="mu">Removes their save. They start fresh next time.</span></div><button class="btn ghr" id="del">Delete game</button></div>
        <div class="dzr admin-only"><div><b>Profile picture</b><span class="mu">Removes their photo. They can upload a new one.</span></div><button class="btn ghr" id="rmav">Remove picture</button></div>
        <div class="dzr final admin-only"><span class="ic">${IC.trash}</span><div class="tx"><b>Delete user</b><span class="mu">Permanently removes the account and its saved game. This can't be undone.</span></div><button class="btn red" id="deluser">${IC.trash} Delete user</button></div>
        <div class="mu" style="margin-top:10px">Credits and game changes only stick for players on the game server, or who aren't playing at that moment.</div></div>`}`;
    let sign = 1;
    const bal = g ? +g.cr || 0 : null;
    const refreshCr = () => {
      const n = Math.trunc(+$("#amt").value) || 0, go = $("#cr_go"), pv = $("#prev_cr");
      $("#m_give").classList.toggle("on", sign > 0); $("#m_take").classList.toggle("on", sign < 0);
      go.className = "btn go " + (sign > 0 ? "give" : "take"); go.textContent = (sign > 0 ? "Give" : "Take") + (n > 0 ? " " + money(n) : " credits");
      if (n <= 0) { pv.innerHTML = "Enter an amount to see the new balance."; return; }
      const after = bal == null ? null : bal + sign * n;
      pv.innerHTML = (sign > 0 ? "Adding " : "Removing ") + "<b>" + money(n) + "</b>" + (sign > 0 ? " to " : " from ") + "<b>" + esc(label) + "</b>" + (after == null ? "." : ". New balance: <b>" + (after < 0 ? "−" : "") + money(Math.abs(after)) + "</b>" + (after < 0 ? " (goes below zero)" : "."));
    };
    $("#m_give").onclick = () => { sign = 1; refreshCr(); }; $("#m_take").onclick = () => { sign = -1; refreshCr(); };
    $("#amt").oninput = refreshCr;
    sb.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { $("#amt").value = b.dataset.q; refreshCr(); });
    $("#cr_go").onclick = () => {
      const n = Math.trunc(+$("#amt").value); if (!n || n < 0) { toast("Enter a positive whole number"); return; }
      ask((sign > 0 ? "Give " : "Take ") + money(n) + "?", (sign > 0 ? "Add to " : "Remove from ") + "<b>" + esc(label) + "</b>'s credits.", { ok: sign > 0 ? "Give" : "Take away" }).then(r => { if (r) run({ type: "credits", amount: sign * n, reason: $("#why").value }); });
    };
    if ($("#ban")) $("#ban").onclick = () => { const h = +$("#dur").value; ask("Suspend " + label + "?", (h ? "For " + esc($("#dur").selectedOptions[0].text) : "Permanently") + ". They are signed out of the game server straight away.", { ok: "Suspend", danger: 1 }).then(r => { if (r) run({ type: "ban", hours: h, reason: $("#bwhy").value }); }); };
    if ($("#unban")) $("#unban").onclick = () => run({ type: "unban" });
    if ($("#rk_go")) $("#rk_go").onclick = () => {
      const v = $("#rk_sel").value, auto = v === "auto";
      ask("Change rank?", "Set <b>" + esc(label) + "</b>'s rank to <b>" + esc(auto ? "Automatic (from jobs done)" : RANKS[+v]) + "</b>.", { ok: "Set rank" })
        .then(x => { if (x) run({ type: "setrank", rank: auto ? null : +v, reason: $("#rk_why").value }); });
    };
    if ($("#rl_s")) $("#rl_s").onclick = () => {
      const r = []; if ($("#rl_a").checked) r.push("admin"); if ($("#rl_d").checked) r.push("developer");
      ask("Change roles?", "Set <b>" + esc(label) + "</b>'s roles to: " + esc(r.join(", ") || "none") + ".", { ok: "Save" }).then(x => { if (x) run({ type: "setroles", roles: r }); });
    };
    if ($("#deluser") && !$("#deluser").disabled) $("#deluser").onclick = () => ask("Delete " + label + "?", "This permanently deletes the <b>account</b> and saved game for <b>" + esc(u.email || label) + "</b>. This cannot be undone.", { ok: "Delete user", danger: 1, reason: 1 }).then(r => {
      if (!r) return;
      api("/api/admin/action", { uid: u.id, type: "deleteuser", reason: r.reason }).then(x => { toast(x.msg || "User deleted"); closeSheet(); loadPlayers(); }).catch(e => toast(e.message));
    });
    if ($("#rmav")) $("#rmav").onclick = () => ask("Remove profile picture?", "Removes <b>" + esc(label) + "</b>'s photo.", { ok: "Remove", danger: 1, reason: 1 }).then(r => { if (r) run({ type: "removeavatar", reason: r.reason }); });
    if ($("#reset")) $("#reset").onclick = () => ask("Reset game?", "Resets <b>" + esc(label) + "</b>'s game to a brand new game. This cannot be undone.", { ok: "Reset", danger: 1, reason: 1 }).then(r => { if (r) run({ type: "reset", reason: r.reason }); });
    if ($("#del")) $("#del").onclick = () => ask("Delete saved game?", "Deletes <b>" + esc(label) + "</b>'s saved game. This cannot be undone.", { ok: "Delete", danger: 1, reason: 1 }).then(r => { if (r) run({ type: "deletegame", reason: r.reason }); });
  }

      <div class="acts admin-only"><button class="btn sm gha" data-mv="${v.id}">Move</button><button class="btn sm ghr" data-dv="${v.id}">Delete</button></div></div>`).join("") : '<div class="empty">' + (f ? "No vehicles match" : "No vehicles") + "</div>"}</div>

    });
    sb.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => {
      const v = all.find(x => x.id === +b.dataset.mv), home = (g.stationList || []).find(s => s.id === v.sid);

      modal.innerHTML = `<div class="box"><div style="font-size:18px;font-weight:700">Move ${esc(v.cs)}</div><div class="mu" style="margin:4px 0 6px">${esc(v.type)} · currently at ${esc(v.station || "?")}. Pick a ${esc(home ? home.type : "station")}:</div>

        <button class="btn" id="mno" style="width:100%;margin-top:14px">Cancel</button></div>`;
      modal.classList.add("on"); $("#mno").onclick = closeModal;
      modal.querySelectorAll("[data-to]").forEach(p => p.onclick = () => { closeModal(); run({ type: "movevehicle", id: v.id, to: +p.dataset.to }); });

  // ---------- rooms ----------
  let roomQ = "", curRoom = null;
  async function showRooms() {
    $("#main").innerHTML = '<input id="rq" type="search" placeholder="Search room name or code" autocomplete="off" style="margin-bottom:12px"><div id="rlist"><div class="card mu">Loading…</div></div>';
    $("#rq").value = roomQ;
    $("#rq").oninput = e => { clearTimeout(timer); timer = setTimeout(() => { roomQ = e.target.value; loadRooms(); }, 350); };
    loadRooms();
  }
  async function loadRooms() {
    const box = $("#rlist"); if (!box) return;
    try {
      const j = await api("/api/admin/rooms?q=" + encodeURIComponent(roomQ));
      box.innerHTML = j.rooms.length ? j.rooms.map(r => `<div class="card pl" data-room="${esc(r.id)}">
          <div class="m"><b>${esc(r.name || "Room")} <span class="mu">${esc(r.code)}</span></b><span class="mu">Host: ${esc(r.host_name || "unknown")}</span></div>
          <div class="r"><b>${r.members}</b><span class="mu">${r.members === 1 ? "member" : "members"}</span><span class="mu">${r.open} open call${r.open === 1 ? "" : "s"}</span></div></div>`).join("")
        : '<div class="card empty">No rooms found.</div>';
      box.querySelectorAll("[data-room]").forEach(e => e.onclick = () => openRoom(e.dataset.room));
    } catch (e) { box.innerHTML = '<div class="card" style="color:var(--rd)">' + esc(e.message) + "</div>"; }
  }
  async function openRoom(id) {
    curRoom = id;
    $("#main").innerHTML = '<div class="card mu">Loading…</div>';
    try {
      const j = await api("/api/admin/room?id=" + encodeURIComponent(id));
      const r = j.room, mem = j.members, open = j.missions, hist = j.recent;
      const pname = x => x.name || x.display_name || "Player";
      $("#main").innerHTML = `<button class="btn sm" id="rback">← All rooms</button>
        <h3>${esc(r.name || "Room")} <span class="mu">code ${esc(r.code)}</span></h3>
        <div class="card mu">Host: ${esc(r.host_name || "unknown")} · ${mem.length} ${mem.length === 1 ? "member" : "members"} · ${open.length} open call${open.length === 1 ? "" : "s"}</div>
        <h3>Members</h3><div class="card">${mem.length ? mem.map(x => `<div class="item">${avatar({ id: x.user_id, name: pname(x) })}
            <div class="m"><b>${esc(pname(x))}${x.user_id === r.host_id ? ' <span class="tag t-ad">HOST</span>' : ""}</b><span class="mu">seen ${esc(relTime(x.last_seen))}</span></div>
            <div class="acts admin-only"><button class="btn sm ghr" data-rm="${esc(x.user_id)}">Remove</button></div></div>`).join("") : '<div class="empty">No members</div>'}</div>
        <h3>Open calls</h3><div class="card">${open.length ? open.map(x => `<div class="item"><div class="m"><b>${esc(x.loc || "Call")}</b><span class="mu">${esc(x.owner_name || "Ally")} · ${esc(x.status)}</span></div>
            <div class="acts admin-only"><button class="btn sm ghr" data-mc="${esc(x.id)}">Cancel</button></div></div>`).join("") : '<div class="empty">No open calls</div>'}</div>
        <h3>Recently finished</h3><div class="card">${hist.length ? hist.map(x => `<div class="lg"><b>${esc(x.loc || "Call")}</b> <span class="mu">${esc(x.status)} · ${esc(x.owner_name || "")} · ${esc(when(x.updated_at))}</span></div>`).join("") : '<div class="empty">None</div>'}</div>
        <h3>Danger zone</h3><div class="card"><button class="btn red" id="rclose" style="width:100%">Close this room</button>
          <div class="mu" style="margin-top:8px">Removes everyone, cancels open calls and hides the room from players. Rewards already earned are kept.</div></div>`;
      $("#rback").onclick = showRooms;
      $("#rclose").onclick = () => ask("Close " + (r.name || "this room") + "?", "Everyone is removed and open calls are cancelled. Rewards already earned are kept.", { ok: "Close room", danger: 1, reason: 1 })
        .then(x => { if (x) roomAct({ type: "room_close", roomId: id, reason: x.reason }); });
      $("#main").querySelectorAll("[data-rm]").forEach(b => b.onclick = () => {
        const x = mem.find(v => v.user_id === b.dataset.rm);
        ask("Remove " + pname(x) + "?", "They leave this room and their open calls here are cancelled.", { ok: "Remove", danger: 1, reason: 1 })
          .then(y => { if (y) roomAct({ type: "room_member_remove", roomId: id, uid: x.user_id, reason: y.reason }); });
      });
      $("#main").querySelectorAll("[data-mc]").forEach(b => b.onclick = () => {
        ask("Cancel this call?", "The call stops for everyone in the room.", { ok: "Cancel call", danger: 1, reason: 1 })
          .then(y => { if (y) roomAct({ type: "room_mission_cancel", roomId: id, missionId: b.dataset.mc, reason: y.reason }); });
      });
    } catch (e) { toast(e.message); showRooms(); }
  }
  async function roomAct(body) {
    try {
      const r = await api("/api/admin/room/action", body);
      toast(r.msg || "Done");
      if (body.type === "room_close") showRooms(); else openRoom(body.roomId);
    } catch (e) { toast(e.message); }
  }

  // ---------- admin action log (cards with names) ----------
  const ACTION_NAMES = { credits: "Credits", ban: "Suspended", unban: "Unsuspended", reset: "Game reset", deletegame: "Game deleted",
    delvehicle: "Vehicle removed", delstation: "Station removed", delhospital: "Hospital removed", movevehicle: "Vehicle moved",
    setroles: "Roles", deleteuser: "User deleted", removeavatar: "Picture removed", announce: "Announcement", announce_end: "Announcement ended", incident: "Incident", incident_update: "Incident update",
    setrank: "Rank changed", bonus: "Bonus created", bonus_end: "Bonus ended", room_close: "Room closed", room_member_remove: "Removed from room", room_mission_cancel: "Call cancelled" };
  const CAT = { credits: "money", unban: "info", ban: "danger", setroles: "info", reset: "warn", deletegame: "danger", deleteuser: "danger", removeavatar: "warn", delvehicle: "danger",
    delstation: "danger", delhospital: "danger", movevehicle: "info", announce: "info", announce_end: "info", incident: "warn", incident_update: "warn",
    setrank: "info", bonus: "money", bonus_end: "info", room_close: "danger", room_member_remove: "danger", room_mission_cancel: "warn" };
  const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
  function relTime(t) {
    const s = (Date.now() - Date.parse(t)) / 1000;
    if (!(s >= 0)) return when(t);
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h ago";
    return when(t);
  }
  function sentence(l) {
    const d = l.detail || {};
    const A = l.adminName ? "<b>" + esc(l.adminName) + "</b>" : "An admin";
    const P = l.targetName ? "<b>" + esc(l.targetName) + "</b>" : "a player";
    const refund = d.refund ? "Refund given" : "No refund";
    switch (l.action) {
      case "credits": return { say: A + (d.amount > 0 ? " gave " : " took ") + "<b>" + money(Math.abs(d.amount)) + "</b>" + (d.amount > 0 ? " to " : " from ") + P, meta: "Balance " + money(d.before) + " → " + money(d.after) };
      case "ban": return { say: A + " suspended " + P, meta: d.hours === "permanent" ? "Permanent" : "For " + plural(d.hours, "hour") };
      case "unban": return { say: A + " lifted " + P + "'s suspension" };
      case "setroles": return { say: A + " changed " + P + "'s roles", meta: ((d.from || []).join(", ") || "no roles") + " → " + ((d.to || []).join(", ") || "no roles") };
      case "setrank": return { say: A + " set " + P + "'s rank to <b>" + esc(rankName(d.to)) + "</b>", meta: rankName(d.from) + " → " + rankName(d.to) };
      case "bonus": return { say: A + " created the bonus <b>" + esc(d.title) + "</b> (" + money(d.amount) + " each)", meta: "Open for " + plural(d.hours, "hour") };
      case "bonus_end": return { say: A + " ended the bonus <b>" + esc(d.title || "") + "</b>" };
      case "reset": return { say: A + " reset " + P + "'s game" };
      case "removeavatar": return { say: A + " removed " + P + "'s profile picture" };
      case "deleteuser": return { say: A + " deleted the account of " + P };
      case "deletegame": return { say: A + " deleted " + P + "'s saved game" };
      case "delvehicle": return { say: A + " removed a vehicle from " + P + "'s game", meta: refund };
      case "delstation": return { say: A + " removed a station from " + P + "'s game", meta: refund };
      case "delhospital": return { say: A + " removed a hospital or prison from " + P + "'s game", meta: refund };
      case "movevehicle": return { say: A + " moved a vehicle in " + P + "'s game" };
      case "announce": return { say: A + " published <b>" + esc(d.title) + "</b>", meta: "Shown " + (d.hours === "until ended" ? "until ended" : "for " + plural(d.hours, "hour")) };
      case "announce_end": return { say: A + " ended an announcement" };
      case "incident": return { say: A + " posted <b>" + esc(d.title) + "</b>", meta: "Status: " + esc(d.status) };
      case "incident_update": return { say: A + " set an incident to " + esc(d.status) };
      case "room_close": return { say: A + " closed the room <b>" + esc(d.room || "") + "</b>", meta: d.code ? "Code " + esc(d.code) : "" };
      case "room_member_remove": return { say: A + " removed " + P + " from a room" };
      case "room_mission_cancel": return { say: A + " cancelled a call in a room", meta: d.call ? "Call: " + esc(d.call) : "" };
      default: return { say: A + " did " + esc(l.action) };
    }
  }
  function logLine(l) {
    const s = sentence(l), cat = CAT[l.action] || "info", d = l.detail || {};
    return `<div class="evt">${avatar({ id: l.admin, name: l.adminName || "?" })}<div class="txt">
      <div class="head"><span class="pill ${cat}">${esc(ACTION_NAMES[l.action] || l.action)}</span><span class="when" title="${esc(when(l.t))}">${esc(relTime(l.t))}</span></div>
      <div class="say">${s.say}</div>${s.meta ? `<div class="meta">${s.meta}</div>` : ""}${d.reason ? `<div class="meta">Reason: ${esc(d.reason)}</div>` : ""}
    </div></div>`;
  }

    $("#main").innerHTML = '<div class="card mu" id="lg">Loading…</div>';
    try {
      const j = await api("/api/admin/log");
      $("#lg").innerHTML = j.log.length ? j.log.map(logLine).join("") : '<div class="empty">No admin actions yet.</div>';
    } catch (e) { $("#lg").innerHTML = '<span style="color:var(--rd)">' + esc(e.message) + "</span>"; }

  // ---------- announcements (banner in the game) ----------
  async function showAnnounce() {
    $("#main").innerHTML = `<h3 style="margin-top:4px">New announcement</h3><div class="card">
      <input id="an_t" placeholder="Title" maxlength="120" style="margin-bottom:8px">
      <textarea id="an_b" rows="4" placeholder="Message to players" maxlength="1000" style="width:100%;margin-bottom:8px"></textarea>
      <div class="row"><select id="an_h"><option value="1">Show for 1 hour</option><option value="24" selected>Show for 1 day</option><option value="168">Show for 7 days</option><option value="0">Until I end it</option></select><button class="btn pri" id="an_go">Publish</button></div>
      <div class="mu" style="margin-top:8px">Players see this as a banner when they open the game. They can close it.</div></div>
      <h3>Announcements</h3><div class="card" id="an_list"><div class="mu">Loading…</div></div>`;
    $("#an_go").onclick = async () => {
      const title = $("#an_t").value.trim(), body = $("#an_b").value.trim();
      if (!title || !body) { toast("Write a title and a message"); return; }
      try { await api("/api/admin/announcement", { title, body, hours: +$("#an_h").value }); toast("Announcement is live"); $("#an_t").value = ""; $("#an_b").value = ""; loadAnnounce(); }
      catch (e) { toast(e.message); }
    };
    loadAnnounce();
  }
  async function loadAnnounce() {
    const box = $("#an_list"); if (!box) return;
    try {
      const j = await api("/api/admin/announcements");
      const now = new Date().toISOString();
      box.innerHTML = j.announcements.length ? j.announcements.map(a => {
        const live = !a.ended_at && a.starts_at <= now && (!a.ends_at || a.ends_at > now);
        return `<div class="item"><div class="m"><b>${esc(a.title)} ${live ? '<span class="tag t-on">LIVE</span>' : '<span class="tag t-idle">ENDED</span>'}</b><span class="mu">${esc(a.body)}</span><span class="mu">${esc(when(a.created_at))}${a.ends_at ? " · until " + esc(when(a.ends_at)) : ""}</span></div>${live ? `<div class="acts admin-only"><button class="btn sm ghr" data-end="${a.id}">End</button></div>` : ""}</div>`;
      }).join("") : '<div class="empty">No announcements yet</div>';
      box.querySelectorAll("[data-end]").forEach(b => b.onclick = async () => {
        try { await api("/api/admin/announcement/end", { id: +b.dataset.end }); toast("Announcement ended"); loadAnnounce(); } catch (e) { toast(e.message); }
      });

  let msList = [], msEdit = null;
  const msNew = () => ({ id: null, status: "draft", svc: "f", name: "", caller: "", needs: {}, secs: 60, pay: 500, places: ["road"], g: 0, qa: [] });
  async function showMissions() {

  async function msLoad() {

        const need = Object.entries(m.needs || {}).map(([k, n]) => n + " " + ((MS_VEH.find(v => v[0] === k) || [])[2] || k)).join(", ");

          : `<button class="btn sm" data-d="${m.id}">Duplicate</button>` + (m.status === "live" ? `<button class="btn sm ghr" data-r="${m.id}">Retire</button>` : `<button class="btn sm gha" data-s="${m.id}">Restore</button>`);

      box.querySelectorAll("[data-p]").forEach(b => b.onclick = () => msStatus(b.dataset.p, "live", "Publish this mission? Its content can't be edited afterwards."));
      box.querySelectorAll("[data-r]").forEach(b => b.onclick = () => msStatus(b.dataset.r, "retired", "Retire this mission? It stops spawning for players."));
      box.querySelectorAll("[data-s]").forEach(b => b.onclick = () => msStatus(b.dataset.s, "live", "Restore this mission so it spawns again?"));
    } catch (e) { box.innerHTML = '<span style="color:var(--rd)">' + esc(e.message) + "</span>"; }
  }
  async function msStatus(id, status, q) {

        <div class="row" style="margin-top:4px"><select data-vs>${vehOpts()}</select><input data-vn type="number" min="1" max="5" value="1" style="width:60px"><button type="button" class="btn sm" data-va>Add</button><button type="button" class="btn sm ghr" data-rm>Remove question</button></div></div>`).join("");
      box2.querySelectorAll("[data-i]").forEach(el => {
        const i = +el.dataset.i, p = m.qa[i];
        el.querySelector("[data-q]").value = p.q || ""; el.querySelector("[data-a]").value = p.a || "";

          c.querySelectorAll("[data-x]").forEach(a => a.onclick = e => { e.preventDefault(); delete p.veh[a.dataset.x]; if (!Object.keys(p.veh).length) delete p.veh; chips(); });
        };
        el.querySelector("[data-va]").onclick = () => {
          const k = el.querySelector("[data-vs]").value, n = Math.max(1, Math.min(5, +el.querySelector("[data-vn]").value || 1));

    $("#ms_save").onclick = async () => {

      const nq = t => t.toLowerCase().replace(/'/g, "\u2019"), seen = new Set();
      let qerr = "";
      m.qa.forEach((p, i) => {

  }

    // Manager = the IDs in ADMIN_IDS on the server. That level itself can't be changed here, but a Manager can add extra roles.
    const mgr = u.owner ? `<div class="role fixed"><span class="sym">${IC.sshield}</span><b>Manager</b><span class="d">Full control, including roles. Set in ADMIN_IDS on the server.${me.owner ? " Tick any extra roles below to add them." : ""}</span></div>` : "";
    if (!me.owner) {
      const list = mgr ? [mgr] : [];
      if (has("admin")) list.push('<div class="role admin" style="border-color:var(--c);cursor:default"><span class="sym">' + IC.shield + '</span><b>Admin</b><span class="d">Can do everything in this panel.</span></div>');

  async function start() {
    if (!session()) return loginForm();
    try { me = await api("/api/admin/me"); }
    catch (e) {
      if (/not an admin/i.test(e.message)) { try { localStorage.removeItem(SES_KEY); } catch (x) { /* ignore */ } return loginForm("That account isn't an admin."); }
      if (/not signed in|401|invalid|expired|jwt/i.test(e.message)) { try { localStorage.removeItem(SES_KEY); } catch (x) { /* ignore */ } return loginForm("Session expired, please sign in again."); }
      $("#main").innerHTML = '<div class="card" style="color:var(--rd)">Can\'t open the admin panel: ' + esc(e.message) + '<div class="row" style="margin-top:10px"><button class="btn" id="rt">Retry</button><button class="btn" id="so">Sign out</button></div></div>';
      $("#rt").onclick = start; $("#so").onclick = signOut; return;
    }
    const staff = me.perms || [];
    document.body.classList.toggle("dev-view", !staff.includes("admin"));
    document.querySelectorAll("#tabs button").forEach(b => { if (["r", "n", "b", "m", "i", "l"].includes(b.dataset.t)) b.hidden = !staff.includes("admin"); });
    document.body.classList.remove("logged-out"); $("#tabs").hidden = false; $("#out").hidden = false; show();
  }
  start();
})();
</script>
</body>
</html>
