<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Frontline Control</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--ac:#2563eb;--rd:#dc2626;--gn:#16a34a;--am:#d97706}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--tx:#e5e7eb;--mu:#94a3b8;--bd:#24304a;--ac:#3b82f6;--rd:#f87171;--gn:#4ade80;--am:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1}
main{max-width:760px;margin:0 auto;padding:14px}
.tabs{display:flex;gap:6px}
.tabs button,.btn{border:0;border-radius:9px;padding:9px 14px;font:600 14px system-ui;cursor:pointer;background:var(--bd);color:var(--tx)}
.tabs button.on,.btn.pri{background:var(--ac);color:#fff}
.btn.red{background:var(--rd);color:#fff}.btn.amb{background:var(--am);color:#fff}.btn.grn{background:var(--gn);color:#052e16}
.btn:disabled{opacity:.5}
input,select{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.u{display:flex;gap:10px;align-items:center;cursor:pointer}
.u .m{flex:1;min-width:0}.u b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu{color:var(--mu);font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.t-on{background:var(--gn);color:#052e16}.t-ban{background:var(--rd);color:#fff}.t-ad{background:var(--ac);color:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:8px 0}
.grid div{font-size:13px;color:var(--mu)}.grid b{display:block;color:var(--tx);font-size:15px}
h3{margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20;overflow:auto;padding:12px}
#sheet .card{max-width:520px;margin:0 auto 12px;position:relative}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;border-radius:10px;padding:10px 16px;z-index:50;max-width:90%;display:none}
.pg{display:flex;justify-content:space-between;align-items:center;margin:6px 0 20px}
.lg{font-size:13px;border-bottom:1px solid var(--bd);padding:8px 0}
.lg:last-child{border:0}
</style>
</head>
<body>
<header>
  <h1>Admin</h1>
  <div class="tabs" id="tabs" hidden><button data-t="p" class="on">Players</button><button data-t="l">Log</button></div>
  <button class="btn" id="out" hidden>Sign out</button>
</header>
<main id="main"><div class="card mu">Loading…</div></main>
<div id="sheet"></div>
<div id="toast"></div>

<script>
(function () {
  "use strict";
  const SB_URL = "https://sexintgplgiyrunglvtq.supabase.co", SB_KEY = "sb_publishable_HoTQ6sXBqCFyt5fUUs7-iQ_7SD4qZVn", SES_KEY = "ukd_sb_session";
  const API = window.FC_API || "https://api.frontlinecontrol.co.uk";
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = n => "£" + (+n || 0).toLocaleString("en-GB");
  const when = t => t ? new Date(t).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "never";
  let tab = "p", q = "", page = 1, timer = 0, me = null;

  function toast(m) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => { t.style.display = "none"; }, 3500); }

  // ---- sign-in: reuse the game's own session (same site, same browser) ----
  function session() { try { return JSON.parse(localStorage.getItem(SES_KEY)); } catch (e) { return null; } }
  async function token() {
    let s = session(); if (!s || !s.access_token) return null;
    if ((s.expires_at || 0) - 30 < Date.now() / 1000) {
      const r = await fetch(SB_URL + "/auth/v1/token?grant_type=refresh_token", { method: "POST", headers: { apikey: SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
      const j = await r.json().catch(() => ({})); if (!r.ok || !j.access_token) return null;
      s = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), user: j.user || s.user };
      try { localStorage.setItem(SES_KEY, JSON.stringify(s)); } catch (e) { /* ignore */ }
    }
    return s.access_token;
  }
  async function api(path, body) {
    const t = await token(); if (!t) throw new Error("Not signed in");
    const r = await fetch(API + path, { method: body ? "POST" : "GET", headers: { Authorization: "Bearer " + t, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({ ok: false, reason: "bad reply from server" }));
    if (!r.ok || j.ok === false) throw new Error(j.reason || ("HTTP " + r.status));
    return j;
  }

  // ---- players ----
  async function loadPlayers() {
    const box = $("#list"); if (!box) return;
    try {
      const j = await api("/api/admin/users?q=" + encodeURIComponent(q) + "&page=" + page);
      const pages = Math.max(1, Math.ceil(j.total / j.per));
      box.innerHTML = (j.users.length ? j.users.map(u => `
        <div class="card u" data-id="${esc(u.id)}">
          <div class="m"><b>${esc(u.name || u.email || u.id)}${u.admin ? '<span class="tag t-ad">ADMIN</span>' : ""}${u.online ? '<span class="tag t-on">ONLINE</span>' : ""}${u.banned_until ? '<span class="tag t-ban">SUSPENDED</span>' : ""}</b>
          <span class="mu">${esc(u.email)}${u.last ? " · seen " + esc(when(u.last)) : ""}</span></div>
          <div style="text-align:right"><b>${u.hasGame ? money(u.cr) : "–"}</b><span class="mu">${u.hasGame ? (u.done || 0) + " jobs" : "no game"}</span></div>
        </div>`).join("") : '<div class="card mu">No players found.</div>') +
        `<div class="pg"><button class="btn" id="prev" ${page <= 1 ? "disabled" : ""}>Back</button><span class="mu">${j.total} player${j.total === 1 ? "" : "s"} · page ${page} of ${pages}</span><button class="btn" id="next" ${page >= pages ? "disabled" : ""}>Next</button></div>`;
      box.querySelectorAll(".u").forEach(e => { e.onclick = () => openUser(e.dataset.id); });
      const pv = $("#prev"), nx = $("#next");
      if (pv) pv.onclick = () => { page--; loadPlayers(); };
      if (nx) nx.onclick = () => { page++; loadPlayers(); };
    } catch (e) { box.innerHTML = '<div class="card" style="color:var(--rd)">' + esc(e.message) + "</div>"; }
  }
  function showPlayers() {
    $("#main").innerHTML = '<input id="q" type="search" placeholder="Search name, email or ID" autocomplete="off" style="margin-bottom:12px"><div id="list"><div class="card mu">Loading…</div></div>';
    $("#q").value = q;
    $("#q").oninput = e => { clearTimeout(timer); timer = setTimeout(() => { q = e.target.value; page = 1; loadPlayers(); }, 350); };
    loadPlayers();
  }

  // ---- one player ----
  const sheet = $("#sheet");
  function closeSheet() { sheet.style.display = "none"; sheet.innerHTML = ""; }
  sheet.onclick = e => { if (e.target === sheet) closeSheet(); };

  // ---- lists inside a player's sheet ----
  const lst = (title, n, rows) => `<details style="margin:6px 0"><summary style="cursor:pointer;font-weight:600">${esc(title)} (${n})</summary><div style="max-height:260px;overflow:auto;margin-top:4px">${n ? rows : '<div class="mu">None</div>'}</div></details>`;
  const gameLists = g => {
    const st = (g.stationList || []).map(x => `<div class="lg"><b>${esc(x.name)}</b> <span class="mu">${esc(x.type)} · ${x.units} vehicle${x.units === 1 ? "" : "s"}</span></div>`).join("");
    const hs = (g.hospitalList || []).map(x => `<div class="lg"><b>${esc(x.name)}</b> <span class="mu">${esc(x.type)}</span></div>`).join("");
    const vh = (g.vehicleList || []).map(v => `<div class="lg"><b>${esc(v.cs)}</b> <span class="mu">${esc(v.type)} · ${esc(v.status)}${v.station ? " · " + esc(v.station) : ""}</span></div>`).join("");
    const jb = (g.jobs || []).map(j => `<div class="lg"><b>${esc(j.n)}</b> <span class="mu">${esc(when(j.t))}</span><br><span class="mu">${j.e >= 0 ? "+" : "−"}${money(Math.abs(j.e))} · balance ${money(j.b)}</span></div>`).join("");
    const lg = (g.log || []).map(l => `<div class="lg"><span class="mu">${esc(when(l.t))}</span><br>${esc(l.m)}</div>`).join("");
    return lst("Stations", (g.stationList || []).length, st) + lst("Hospitals / prisons", (g.hospitalList || []).length, hs) + lst("Vehicles", (g.vehicleList || []).length, vh) + lst("Money log", (g.jobs || []).length, jb) + lst("Game log", (g.log || []).length, lg);
  };

  async function openUser(id) {
    sheet.style.display = "block"; sheet.innerHTML = '<div class="card mu">Loading…</div>';
    try {
      const j = await api("/api/admin/user?id=" + encodeURIComponent(id)), u = j.user, g = j.game, label = u.name || u.email || u.id;
      sheet.innerHTML = `<div class="card">
        <div class="row" style="align-items:flex-start"><div><b style="font-size:18px">${esc(label)}</b>${u.admin ? '<span class="tag t-ad">ADMIN</span>' : ""}${u.banned_until ? '<span class="tag t-ban">SUSPENDED</span>' : ""}
        <div class="mu">${esc(u.email)}</div><div class="mu" style="word-break:break-all">${esc(u.id)}</div></div><button class="btn" id="x" style="flex:none">Close</button></div>
        <div class="grid"><div>Joined<b>${esc(when(u.created))}</b></div><div>Last sign-in<b>${esc(when(u.last))}</b></div>
        ${u.banned_until ? `<div>Suspended until<b>${esc(when(u.banned_until))}</b></div>` : ""}</div>
        <h3>Game</h3>
        ${g ? `<div class="grid"><div>Rank<b>${esc(g.rank || "–")}</b></div><div>Credits<b>${money(g.cr)}</b></div><div>Jobs done<b>${g.done}</b></div><div>Stations<b>${g.stations}</b></div><div>Hospitals / prisons<b>${g.hospitals}</b></div><div>Vehicles<b>${g.vehicles}</b></div><div>Staff<b>${g.staff}</b></div><div>Running on server<b>${g.running ? "Yes" : "No"}</b></div></div>${gameLists(g)}` : '<div class="mu">No saved game.</div>'}
        <h3>Credits</h3>
        <div class="row"><input id="amt" type="number" inputmode="numeric" placeholder="Amount, e.g. 50000"><input id="why" placeholder="Reason (kept in the log)"></div>
        <div class="row" style="margin-top:8px"><button class="btn grn" id="add">Give</button><button class="btn amb" id="take">Take away</button></div>
        <h3>Suspend</h3>
        ${u.admin ? '<div class="mu">Admins can\'t be suspended or reset from here.</div>' : u.banned_until ? '<button class="btn pri" id="unban" style="width:100%">Lift suspension</button>' : `
        <div class="row"><select id="dur"><option value="1">1 hour</option><option value="24" selected>1 day</option><option value="168">7 days</option><option value="720">30 days</option><option value="0">Permanent</option></select><input id="bwhy" placeholder="Reason (kept in the log)"></div>
        <button class="btn red" id="ban" style="width:100%;margin-top:8px">Suspend</button>`}
        ${u.admin ? "" : `<h3>Game data</h3><div class="row"><button class="btn amb" id="reset">Reset game</button><button class="btn red" id="del">Delete saved game</button></div>
        <div class="mu" style="margin-top:6px">Both start them on a new game. Credits and game changes only stick for players on the game server, or who aren't playing at that moment.</div>`}
      </div>`;
      $("#x").onclick = closeSheet;
      const run = async (body, done) => { try { const r = await api("/api/admin/action", Object.assign({ uid: id }, body)); toast(r.msg || "Done"); if (done !== false) { await openUser(id); loadPlayers(); } } catch (e) { toast(e.message); } };
      const credits = sign => () => {
        const n = Math.trunc(+$("#amt").value); if (!n || n < 0) { toast("Enter a positive whole number"); return; }
        if (!confirm((sign > 0 ? "Give " : "Take ") + money(n) + (sign > 0 ? " to " : " from ") + label + "?")) return;
        run({ type: "credits", amount: sign * n, reason: $("#why").value });
      };
      $("#add").onclick = credits(1); $("#take").onclick = credits(-1);
      if ($("#ban")) $("#ban").onclick = () => { const h = +$("#dur").value; if (confirm("Suspend " + label + (h ? " for " + $("#dur").selectedOptions[0].text : " permanently") + "? They are signed out of the game server straight away.")) run({ type: "ban", hours: h, reason: $("#bwhy").value }); };
      if ($("#unban")) $("#unban").onclick = () => run({ type: "unban" });
      if ($("#reset")) $("#reset").onclick = () => { if (confirm("Reset " + label + "'s game to a brand new game? This cannot be undone.")) run({ type: "reset" }); };
      if ($("#del")) $("#del").onclick = () => { if (confirm("Delete " + label + "'s saved game? This cannot be undone.")) run({ type: "deletegame" }); };
    } catch (e) { sheet.innerHTML = '<div class="card" style="color:var(--rd)">' + esc(e.message) + '</div><div class="card"><button class="btn" id="x2" style="width:100%">Close</button></div>'; $("#x2").onclick = closeSheet; }
  }

  // ---- log ----
  async function showLog() {
    $("#main").innerHTML = '<div class="card mu" id="lg">Loading…</div>';
    try {
      const j = await api("/api/admin/log");
      $("#lg").className = "card";
      $("#lg").innerHTML = j.log.length ? j.log.map(l => `<div class="lg"><b>${esc(l.action)}</b> <span class="mu">${esc(when(l.t))}</span><br><span class="mu">by ${esc(l.admin)}${l.target ? " · on " + esc(l.target) : ""}</span>${l.detail ? '<br><span class="mu">' + esc(JSON.stringify(l.detail)) + "</span>" : ""}</div>`).join("") : '<span class="mu">Nothing logged yet.</span>';
    } catch (e) { $("#lg").innerHTML = '<span style="color:var(--rd)">' + esc(e.message) + "</span>"; }
  }

  function show() { tab === "p" ? showPlayers() : showLog(); }
  document.querySelectorAll("#tabs button").forEach(b => { b.onclick = () => { tab = b.dataset.t; document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b)); show(); }; });

  // ---- own sign-in (this site has its own storage, so it can't reuse the game's session) ----
  function loginForm(err) {
    $("#tabs").hidden = true; $("#out").hidden = true;
    $("#main").innerHTML = `<form class="card" id="lf" style="max-width:360px;margin:40px auto">
      <b style="font-size:18px">Admin sign-in</b>
      <div style="margin:12px 0 8px"><input id="em" type="email" placeholder="Email" autocomplete="username" required></div>
      <div style="margin-bottom:12px"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" required></div>
      <button class="btn pri" id="go" style="width:100%">Sign in</button>
      <div id="le" style="color:var(--rd);margin-top:10px;font-size:13px">${esc(err || "")}</div></form>`;
    $("#lf").onsubmit = async e => {
      e.preventDefault(); const b = $("#go"); b.disabled = true; $("#le").textContent = "";
      try {
        const r = await fetch(SB_URL + "/auth/v1/token?grant_type=password", { method: "POST", headers: { apikey: SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ email: $("#em").value.trim(), password: $("#pw").value }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.access_token) throw new Error(j.error_description || j.msg || "Sign-in failed");
        localStorage.setItem(SES_KEY, JSON.stringify({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), user: j.user }));
        start();
      } catch (x) { b.disabled = false; $("#le").textContent = x.message; }
    };
  }
  async function signOut() {
    try { const t = await token(); if (t) await fetch(SB_URL + "/auth/v1/logout", { method: "POST", headers: { apikey: SB_KEY, Authorization: "Bearer " + t } }); } catch (e) { /* ignore */ }
    try { localStorage.removeItem(SES_KEY); } catch (e) { /* ignore */ }
    closeSheet(); loginForm();
  }
  $("#out").onclick = signOut;

  async function start() {
    if (!session()) return loginForm();
    try { me = await api("/api/admin/me"); }
    catch (e) {
      if (/not an admin/i.test(e.message)) { try { localStorage.removeItem(SES_KEY); } catch (x) { /* ignore */ } return loginForm("That account isn't an admin."); }
      if (/not signed in|401|invalid|expired|jwt/i.test(e.message)) { try { localStorage.removeItem(SES_KEY); } catch (x) { /* ignore */ } return loginForm("Session expired, please sign in again."); }
      $("#main").innerHTML = '<div class="card" style="color:var(--rd)">Can\'t open the admin panel: ' + esc(e.message) + ' <button class="btn" id="rt">Retry</button> <button class="btn" id="so">Sign out</button></div>';
      $("#rt").onclick = start; $("#so").onclick = signOut; return;
    }
    $("#tabs").hidden = false; $("#out").hidden = false; show();
  }
  start();
})();
</script>
</body>
</html>
