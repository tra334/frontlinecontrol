<html lang="en-GB"><head><meta charset="utf-8">

<header><div><b>Frontline Control</b><small id="sync">Loading…</small></div><div class="dx"><div><span id="clk"></span><small>UK TIME</small></div><div><span id="k1">0</span><small>CALLS WAITING</small></div><div><span id="k2">0</span><small>OPEN INCIDENTS</small></div><div><span id="k3">0</span><small>UNITS AVAILABLE</small></div><div><span id="k4">0</span><small>DEPLOYED</small></div><span id="hs"></span></div><div class="cr"><span id="cr"></span><span id="testing" style="padding:1px 5px;border:1px solid #eab308;border-radius:3px;color:#eab308;font:700 9px system-ui;letter-spacing:.08em">D 1.0.3</span><small id="rk"></small></div></header>
<div id="mapw"><div id="map"></div><div id="bm"></div><div id="bsr"><form id="bsf"><input id="bsi" type="search" placeholder="Search address, city or postcode" autocomplete="off" enterkeyhint="search"><button class="s" type="submit">Search</button></form><div id="bsl"></div></div><div id="lg"><span><i style="background:#dc2626"></i>G1</span><span><i style="background:#f97316"></i>G2</span><span><i style="background:#eab308"></i>G3</span><span><i style="background:#64748b"></i>G4</span><span><i style="background:transparent;border:2px solid #fde047;box-sizing:border-box"></i>Responding</span></div><div id="fabw"><div id="fabr"><button id="fab" type="button" aria-label="Build a station">＋</button><span id="dbg">DEBUG: Time until new call --:--</span></div><div id="fabm" hidden></div></div></div><div id="ctl" hidden></div>
<main id="v" hidden></main>
<aside id="pl"><div class="ph"><span>INCIDENT QUEUE</span><span id="plc"></span></div><div id="plb"></div></aside>
<section id="rl"><div class="ph"><span>RADIO &amp; EVENT LOG</span></div><div id="rlb"></div></section>
<nav><button data-t="m" class="on">🗺 Map</button><button data-t="c">Calls</button><button data-t="s">Stations</button><button data-t="l">Radio</button><button data-t="r">Ranks</button></nav>
<div id="toast" hidden></div><div id="modal" hidden><div id="sw"><button id="xb" onclick="closeM()" aria-label="Close">✕</button><div id="sheet"></div></div></div>
