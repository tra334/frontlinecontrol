name: GitHub comments to Discourse

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  relay:
    if: ${{ !github.event.issue.pull_request && github.event.comment.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/scripts/comment-to-discourse.js
        env:
          DISCOURSE_URL: ${{ secrets.DISCOURSE_URL }}
          DISCOURSE_API_KEY: ${{ secrets.DISCOURSE_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENTER: ${{ github.event.comment.user.login }}
          FRONTLINE_USER: Frontline
          THOMAS_USER: Thomas
          GITHUB_THOMAS_LOGIN: tra334
