
name: Publish commits to Discourse

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Publish code changes to Discourse
        env:
          DISCOURSE_URL: ${{ secrets.DISCOURSE_URL }}
          DISCOURSE_API_KEY: ${{ secrets.DISCOURSE_API_KEY }}
          DISCOURSE_API_USERNAME: ${{ secrets.DISCOURSE_API_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMITS: ${{ toJSON(github.event.commits) }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import urllib.parse

          base = os.environ["DISCOURSE_URL"].rstrip("/")
          repo = os.environ["REPOSITORY"]

          discourse_headers = {
              "Api-Key": os.environ["DISCOURSE_API_KEY"],
              "Api-Username": os.environ["DISCOURSE_API_USERNAME"],
              "Accept": "application/json"
          }

          def get_github_commit(sha):
              url = f"https://api.github.com/repos/{repo}/commits/{sha}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28"
                  }
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def post_discourse(data):
              request = urllib.request.Request(
                  base + "/posts.json",
                  data=urllib.parse.urlencode(data).encode(),
                  headers=discourse_headers,
                  method="POST"
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          commits = json.loads(os.environ.get("COMMITS") or "[]")

          if not commits and os.environ["EVENT_NAME"] == "workflow_dispatch":
              commits = [{"id": os.environ["EVENT_SHA"]}]

          for item in commits:
              sha = item.get("id")
              if not sha:
                  continue

              details = get_github_commit(sha)
              commit = details.get("commit", {})
              message = commit.get("message", "Code update").splitlines()[0]
              author = (
                  (details.get("author") or {}).get("login")
                  or commit.get("author", {}).get("name", "Unknown")
              )
              files = details.get("files", [])
              stats = details.get("stats", {})
              commit_url = details.get("html_url", "")
              
              lines = [
                  "# Frontline Control — Code Update",
                  "",
                  f"**Commit:** `{sha[:7]}`",
                  f"**Author:** {author}",
                  f"**Repository:** `{repo}`",
                  "",
                  "## Summary",
                  "",
                  message,
                  "",
                  "## Statistics",
                  "",
                  f"- Files changed: {len(files)}",
                  f"- Lines added: {stats.get('additions', 0)}",
                  f"- Lines removed: {stats.get('deletions', 0)}",
                  ""
              ]

              for file in files:
                  filename = file.get("filename", "Unknown file")
                  status = file.get("status", "changed")
                  patch = file.get("patch", "")

                  lines.extend([
                      "---",
                      "",
                      f"## `{filename}`",
                      "",
                      f"**Status:** {status.title()}",
                      f"**Changes:** +{file.get('additions', 0)} / -{file.get('deletions', 0)}",
                      ""
                  ])

                  if patch:
                      lines.extend([
                          "### Actual code changes",
                          "",
                          "```diff",
                          patch[:12000],
                          "```",
                          ""
                      ])
                      if len(patch) > 12000:
                          lines.append(
                              "_Diff preview shortened. Open the full commit on GitHub to see the rest._"
                          )
                          lines.append("")
                  else:
                      lines.extend([
                          "_GitHub did not provide an inline diff for this file. "
                          "It may be binary or the change may be too large._",
                          ""
                      ])

              lines.extend([
                  "---",
                  "",
                  f"[View full code and diff on GitHub]({commit_url})"
              ])

              title = f"Code Update: {message}"[:250]
              raw = "\n".join(lines)

              try:
                  result = post_discourse({
                      "title": title,
                      "raw": raw,
                      "category": "7"
                  })
                  print(
                      f"Published commit {sha[:7]} "
                      f"as Discourse topic {result.get('topic_id')}"
                  )
              except urllib.error.HTTPError as error:
                  print(f"Discourse returned HTTP {error.code}")
                  print(error.read().decode()[:1500])
                  raise

          PY
