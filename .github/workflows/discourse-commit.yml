
name: Publish commits to Discourse

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Publish commits to Discourse
        env:
          DISCOURSE_URL: ${{ secrets.DISCOURSE_URL }}
          DISCOURSE_API_KEY: ${{ secrets.DISCOURSE_API_KEY }}
          DISCOURSE_API_USERNAME: ${{ secrets.DISCOURSE_API_USERNAME }}
          COMMITS: ${{ toJSON(github.event.commits) }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          import urllib.parse

          base = os.environ["DISCOURSE_URL"].rstrip("/")
          api_key = os.environ["DISCOURSE_API_KEY"]
          username = os.environ["DISCOURSE_API_USERNAME"]
          repo = os.environ["REPOSITORY"]
          commits = json.loads(os.environ.get("COMMITS") or "[]")

          headers = {
              "Api-Key": api_key,
              "Api-Username": username,
              "Accept": "application/json"
          }

          def post_topic(title, raw):
              payload = urllib.parse.urlencode({
                  "title": title,
                  "raw": raw,
                  "category": "7"
              }).encode()

              request = urllib.request.Request(
                  base + "/posts.json",
                  data=payload,
                  headers=headers,
                  method="POST"
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          if not commits:
              print("No commits supplied by this event.")
              print("The workflow ran successfully.")
              raise SystemExit(0)

          for commit in commits:
              sha = commit.get("id", "")
              if not sha:
                  continue

              message = commit.get("message", "Code update").splitlines()[0]
              author = commit.get("author", {}).get("name", "Unknown")
              commit_url = f"https://github.com/{repo}/commit/{sha}"

              title = f"Commit: {message}"[:250]
              raw = (
                  f"**Repository:** `{repo}`\n\n"
                  f"**Author:** {author}\n\n"
                  f"**Commit:** `{sha[:7]}`\n\n"
                  f"**Message:** {message}\n\n"
                  f"[View commit on GitHub]({commit_url})"
              )

              try:
                  result = post_topic(title, raw)
                  print(
                      f"Published {sha[:7]} "
                      f"as topic {result.get('topic_id')}"
                  )
              except urllib.error.HTTPError as error:
                  print(f"Discourse returned HTTP {error.code}.")
                  print(error.read().decode()[:1000])
                  raise

          PY
