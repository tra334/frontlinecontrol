name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload site to VPS
        run: |
          rsync -az --itemize-changes \
            --exclude '.git' --exclude '.github' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./ game@${{ secrets.VPS_HOST }}:/home/game/app/frontlinecontrol-main/ | tee changes.txt

      - name: Restart game server if game code changed
        run: |
          if grep -q -E '^[<>]f.* js/' changes.txt; then
            echo "js/ changed, restarting game server"
            ssh -i ~/.ssh/id_ed25519 game@${{ secrets.VPS_HOST }} "sudo /bin/systemctl restart frontline"
          else
            echo "No js/ changes, server not restarted"
          fi
